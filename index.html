<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XYZ Wallet</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }

    /* ========== TEMA: UNGU (DEFAULT) ========== */
    :root {
      --bg1:#0b0514; --bg2:#1a0b2e;
      --surface:#140a24; --surface2:#1d0f33; --surface3:#251540;
      --field-bg:#10071d; --field-border:#4c2a85;
      --text-main:#f3e8ff; --text-dim:#a794c4; --label:#c9a6ff;
      --accent:#a855f7; --accent-soft:#c084fc; --accent-light:#e9d5ff;
      --grad1:#2e1065; --grad2:#7c3aed; --grad3:#a855f7;
      --glow:rgba(168,85,247,0.45); --glow-strong:rgba(168,85,247,0.6); --glow-soft:rgba(139,92,246,0.25);
      --border-soft:rgba(192,132,252,0.2); --border-mid:rgba(192,132,252,0.35); --border-light:rgba(233,213,255,0.35);
      --nav-idle:#7e6a9c; --icon-stroke:#7c3aed; --icon-circle-bg:#f3e8ff;
      --secondary-bg:#2a1745; --secondary-text:#b8a3d9;
      --note-bg:rgba(168,85,247,0.10);
    }

    /* ========== TEMA: BIRU ========== */
    body[data-theme="biru"] {
      --bg1:#050d1a; --bg2:#0a1f3d;
      --surface:#0a1930; --surface2:#0d2242; --surface3:#102a4c;
      --field-bg:#071427; --field-border:#1e4976;
      --text-main:#eaf4ff; --text-dim:#8aa3c0; --label:#8ecbff;
      --accent:#4da3ff; --accent-soft:#7cc0ff; --accent-light:#bfe0ff;
      --grad1:#0a2a5e; --grad2:#1d5bbf; --grad3:#4da3ff;
      --glow:rgba(77,163,255,0.45); --glow-strong:rgba(77,163,255,0.6); --glow-soft:rgba(61,142,255,0.25);
      --border-soft:rgba(124,192,255,0.2); --border-mid:rgba(124,192,255,0.35); --border-light:rgba(191,224,255,0.35);
      --nav-idle:#5f7ea6; --icon-stroke:#1d5bbf; --icon-circle-bg:#eaf4ff;
      --secondary-bg:#16304f; --secondary-text:#9fb6d4;
      --note-bg:rgba(77,163,255,0.10);
    }

    /* ========== TEMA: MERAH ========== */
    body[data-theme="merah"] {
      --bg1:#150507; --bg2:#2a0a10;
      --surface:#200a0e; --surface2:#2d0f15; --surface3:#3a141b;
      --field-bg:#180609; --field-border:#7f1d1d;
      --text-main:#fee2e2; --text-dim:#c09494; --label:#fca5a5;
      --accent:#ef4444; --accent-soft:#f87171; --accent-light:#fecaca;
      --grad1:#450a0a; --grad2:#b91c1c; --grad3:#ef4444;
      --glow:rgba(239,68,68,0.45); --glow-strong:rgba(239,68,68,0.6); --glow-soft:rgba(185,28,28,0.25);
      --border-soft:rgba(248,113,113,0.2); --border-mid:rgba(248,113,113,0.35); --border-light:rgba(254,202,202,0.35);
      --nav-idle:#9c6a6a; --icon-stroke:#b91c1c; --icon-circle-bg:#fee2e2;
      --secondary-bg:#451a1a; --secondary-text:#d9a3a3;
      --note-bg:rgba(239,68,68,0.10);
    }

    body {
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .hidden { display: none !important; }

    /* ========== LOGIN & PIN ========== */
    .login-screen { width: 100%; display: flex; justify-content: center; }

    .login-card {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 0 50px var(--glow-soft);
      text-align: center; height: fit-content;
    }

    .login-logo {
      width: 70px; height: 70px; border-radius: 20px;
      background: linear-gradient(135deg, var(--grad2), var(--grad3));
      color: white; font-weight: bold; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      box-shadow: 0 0 30px var(--glow-strong);
    }

    .login-card h2 { margin-bottom: 4px; color: var(--text-main); letter-spacing: 1px; }
    .login-subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .login-card label { display: block; text-align: left; font-size: 13px; color: var(--label); margin-bottom: 6px; }

    .login-card input {
      width: 100%; padding: 12px;
      border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text-main);
      border-radius: 12px; margin-bottom: 14px; font-size: 14px;
    }

    .login-card button {
      width: 100%; border: none; border-radius: 12px; padding: 13px;
      font-size: 14px; font-weight: bold; cursor: pointer;
      background: linear-gradient(135deg, var(--grad2), var(--grad3));
      color: white;
      box-shadow: 0 0 20px var(--glow);
    }

    .otp-demo-note {
      background: var(--note-bg);
      border: 1px dashed var(--accent); color: var(--accent-light);
      border-radius: 12px; padding: 10px; font-size: 12px; margin-bottom: 14px;
      text-align: left;
    }

    /* ========== MODAL ========== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
    }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: 20px; padding: 24px; width: 100%; max-width: 340px; text-align: center;
      box-shadow: 0 0 50px var(--glow-soft);
      max-height: 90vh; overflow-y: auto;
    }

    .modal-card h3 { margin-bottom: 14px; color: var(--text-main); letter-spacing: 1px; }

    .modal-card input {
      width: 100%; padding: 12px;
      border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text-main);
      border-radius: 12px; margin-bottom: 12px; font-size: 14px;
    }

    .modal-card .pin-input { text-align: center; letter-spacing: 2px; }

    .modal-card button {
      width: 100%; border: none; border-radius: 12px; padding: 12px;
      font-size: 14px; font-weight: bold; cursor: pointer;
      background: linear-gradient(135deg, var(--grad2), var(--grad3)); color: white;
    }

    .btn-secondary { background: var(--secondary-bg) !important; color: var(--secondary-text) !important; margin-top: 8px; box-shadow: none !important; }

    select {
      width: 100%; padding: 12px;
      border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text-main);
      border-radius: 12px; margin-bottom: 12px; font-size: 14px;
    }

    input[type="date"] { color-scheme: dark; }

    /* ========== APLIKASI UTAMA ========== */
    .app {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 50px var(--glow-soft);
      height: fit-content;
    }

    .header {
      background: linear-gradient(135deg, var(--grad1), var(--grad2) 55%, var(--grad3));
      color: white; padding: 24px 20px;
    }

    .header h1 {
      font-size: 22px; letter-spacing: 2px; text-transform: uppercase;
      text-shadow: 0 0 14px var(--glow-strong);
    }

    .datetime {
      margin-top: 6px; font-size: 13px; opacity: 0.95; letter-spacing: 1px;
      font-family: Consolas, Menlo, monospace;
      color: var(--accent-light);
    }

    .balance-card {
      margin-top: 18px; background: rgba(255,255,255,0.10);
      border: 1px solid var(--border-light);
      border-radius: 18px; padding: 18px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }

    .balance-left { flex: 1; text-align: left; }
    .balance-label { font-size: 12px; opacity: 0.85; margin-bottom: 6px; letter-spacing: 2px; text-transform: uppercase; }

    .balance-value {
      font-size: 30px; font-weight: bold;
      font-family: Consolas, Menlo, monospace;
      text-shadow: 0 0 16px var(--glow-strong);
    }

    .balance-actions { display: flex; gap: 10px; }

    .action-btn {
      width: 80px; background: rgba(255,255,255,0.12); border: 1px solid var(--border-light);
      border-radius: 14px; padding: 10px 6px; color: white;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; font-size: 11px; font-weight: bold;
    }
    .action-btn:hover { background: rgba(255,255,255,0.22); }

    .icon-circle {
      width: 34px; height: 34px; background: var(--icon-circle-bg); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 14px var(--glow-strong);
    }

    .icon-circle svg { stroke: var(--icon-stroke); }
    .ppob-item svg { stroke: var(--accent-soft); }

    .page-header { background: linear-gradient(135deg, var(--grad1), var(--grad2) 55%, var(--grad3)); color: white; padding: 20px; }
    .page-header h2 {
      font-size: 20px; letter-spacing: 2px; text-transform: uppercase;
      text-shadow: 0 0 14px var(--glow-strong);
    }

    .content { padding: 20px; }

    .home-section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .home-section-head .section-title { margin: 0; }

    .link-btn { width: auto; background: none; color: var(--accent-soft); font-size: 12px; padding: 0; }

    .section-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: var(--text-main); letter-spacing: 1px; }

    .ppob-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }

    .ppob-item {
      background: var(--surface2); border: 1px solid var(--border-soft);
      border-radius: 14px; padding: 10px 4px; color: var(--accent-light);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; font-size: 10px; font-weight: bold;
    }
    .ppob-item:hover { border-color: var(--accent-soft); box-shadow: 0 0 14px var(--glow); }
    .ppob-item svg { width: 20px; height: 20px; }

    .card {
      background: var(--surface2); border: 1px solid var(--border-soft);
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
    }

    label { display: block; font-size: 13px; color: var(--label); margin-bottom: 6px; text-align: left; }

    input {
      width: 100%; padding: 12px;
      border: 1px solid var(--field-border); background: var(--field-bg); color: var(--text-main);
      border-radius: 12px; margin-bottom: 12px; font-size: 14px;
    }

    button {
      width: 100%; border: none; border-radius: 12px; padding: 12px;
      font-size: 14px; font-weight: bold; cursor: pointer;
    }

    .btn-topup {
      background: linear-gradient(135deg, #059669, #34d399);
      color: white; margin-bottom: 8px;
      box-shadow: 0 0 14px rgba(52,211,153,0.35);
    }

    .btn-transfer {
      background: linear-gradient(135deg, var(--grad2), var(--grad3));
      color: white;
      box-shadow: 0 0 16px var(--glow);
    }

    .btn-outline { background: transparent; color: var(--accent-soft); border: 2px solid var(--accent-soft); margin-bottom: 10px; }

    .transaction-list { max-height: 380px; overflow-y: auto; }

    .transaction-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border-radius: 12px;
      background: var(--surface3); border: 1px solid var(--border-soft);
      margin-bottom: 10px;
    }

    .transaction-info h4 { font-size: 14px; margin-bottom: 4px; color: var(--text-main); }
    .transaction-info p { font-size: 12px; color: var(--text-dim); }

    .amount-positive { color: #34d399; font-weight: bold; font-family: Consolas, Menlo, monospace; }
    .amount-negative { color: #fb7185; font-weight: bold; font-family: Consolas, Menlo, monospace; }

    .empty-state { text-align: center; color: #64748b; font-size: 13px; padding: 20px 0; }

    #qrCanvas { display: block; margin: 0 auto 8px; background: white; border-radius: 12px; }
    .qr-note { font-size: 11px; color: #64748b; margin-bottom: 14px; text-align: center; }

    .profile-card { text-align: center; }
    .profile-avatar {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, var(--grad2), var(--grad3));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 10px; color: white;
      box-shadow: 0 0 24px var(--glow-strong);
    }
    .profile-card h3 { color: var(--text-main); margin-bottom: 4px; font-family: Consolas, Menlo, monospace; }
    .profile-card p { font-size: 12px; color: #94a3b8; }

    /* ========== PEMILIH TEMA ========== */
    .theme-grid { display: flex; gap: 10px; }

    .theme-btn {
      flex: 1; width: auto; padding: 10px 6px; border-radius: 12px;
      border: 2px solid transparent;
      background: var(--surface3); color: var(--text-main);
      font-size: 11px; font-weight: bold; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }

    .theme-btn.active { border-color: var(--accent-soft); box-shadow: 0 0 12px var(--glow); }

    .swatch { width: 22px; height: 22px; border-radius: 50%; }
    .swatch-ungu { background: linear-gradient(135deg, #7c3aed, #a855f7); }
    .swatch-biru { background: linear-gradient(135deg, #1d5bbf, #4da3ff); }
    .swatch-merah { background: linear-gradient(135deg, #b91c1c, #ef4444); }

    /* ========== BOTTOM NAVIGATION ========== */
    .bottom-nav { display: flex; border-top: 1px solid var(--border-soft); background: var(--field-bg); }

    .nav-item {
      flex: 1; background: none; border: none; padding: 10px 4px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 9px; color: var(--nav-idle); cursor: pointer; font-weight: bold; letter-spacing: 1px;
    }

    .nav-item.active { color: var(--accent-soft); text-shadow: 0 0 12px var(--glow-strong); }
    .nav-item svg { width: 20px; height: 20px; }
  </style>
</head>
<body>

  <!-- ========== HALAMAN LOGIN ========== -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">XYZ</div>
      <h2>XYZ Wallet</h2>
      <p class="login-subtitle">Masuk untuk melanjutkan</p>

      <label for="phoneInput">Nomor HP</label>
      <input type="tel" id="phoneInput" placeholder="Contoh: 08123456789" />
      <button onclick="sendOtp()">Kirim Kode OTP</button>

      <div id="otpSection" class="hidden" style="margin-top: 18px;">
        <div class="otp-demo-note" id="otpDemoNote"></div>
        <label for="otpInput">Kode OTP</label>
        <input type="text" id="otpInput" maxlength="6" placeholder="Masukkan 6 digit OTP" />
        <button onclick="login()">Masuk</button>
      </div>
    </div>
  </div>

  <!-- ========== HALAMAN BUAT PIN ========== -->
  <div class="login-screen hidden" id="pinSetupScreen">
    <div class="login-card">
      <div class="login-logo">PIN</div>
      <h2>Buat PIN Transaksi</h2>
      <p class="login-subtitle">PIN 6 digit digunakan untuk mengamankan transaksimu</p>

      <label for="newPinInput">PIN Baru (6 digit)</label>
      <input type="password" id="newPinInput" maxlength="6" inputmode="numeric" placeholder="******" />

      <label for="confirmPinInput">Ulangi PIN</label>
      <input type="password" id="confirmPinInput" maxlength="6" inputmode="numeric" placeholder="******" />

      <button onclick="savePin()">Simpan PIN</button>
    </div>
  </div>

  <!-- ========== APLIKASI UTAMA ========== -->
  <div class="app hidden" id="appScreen">

    <!-- ===== HOME ===== -->
    <div class="page" id="pageHome">
      <div class="header">
        <h1>XYZ Wallet</h1>
        <div class="datetime" id="datetimeDisplay">Memuat waktu...</div>

        <div class="balance-card">
          <div class="balance-left">
            <div class="balance-label">Saldo Anda</div>
            <div class="balance-value" id="balanceDisplay">Rp 0</div>
          </div>

          <div class="balance-actions">
            <button class="action-btn" onclick="goDeposit()" title="Deposit">
              <span class="icon-circle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/>
                </svg>
              </span>
              Deposit
            </button>

            <button class="action-btn" onclick="goWithdraw()" title="Withdraw">
              <span class="icon-circle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 21V9"/><path d
